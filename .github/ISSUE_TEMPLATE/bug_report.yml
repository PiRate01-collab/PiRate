name: "Bug report / Ошибка PiRate"
description: "Report a reproducible installation, WebUI or connection problem"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Preferred bug reports: https://t.me/pirate_open (comments where available).**
        GitHub Issues are also welcome. Do not share passwords, VPN private keys, full configs or backups. Vulnerabilities must be reported privately using SECURITY.md.
  - type: input
    id: pirate-version
    attributes:
      label: PiRate version / Версия
      placeholder: "v0.5.9-beta.1"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Raspberry Pi model and Raspberry Pi OS
      placeholder: "Raspberry Pi 4 / Raspberry Pi OS Lite 64-bit (Trixie)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Компонент
      options:
        - "Install / upgrade"
        - "Wi-Fi AP / DHCP / DNS"
        - "WireGuard"
        - "OpenVPN"
        - "SOCKS5 / HTTP proxy"
        - "Direct / routing / firewall"
        - "WebUI / Logs"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / Что произошло?
      description: "Explain what you expected and what happened instead."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить?
      placeholder: "1. Open WebUI...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sanitized log excerpt / Очищенные логи
      description: "Only a short manually reviewed excerpt; no credentials or full diagnostic ZIP."
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Безопасность
      options:
        - label: "I removed passwords, keys, tokens and other sensitive data."
          required: true
